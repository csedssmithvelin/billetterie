<style>
[hidden]{display:none!important}
:root{--bg:#f3f5fa;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e8ecf3;--brand:#1d4ed8;--brand-d:#1e3a8a;--brand2:#e0e9ff;--ok:#047857;--okb:#d1fae5;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2;--sh:0 1px 2px #0f172a0a,0 10px 28px -14px #0f172a26}

*{box-sizing:border-box}
/* V.10.1 : tuiles, photos, mode sombre */
.une{position:relative;overflow:hidden;border-radius:18px;margin:0 0 14px;height:190px;box-shadow:var(--sh)}
.une .tr{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.une .tr::-webkit-scrollbar{display:none}
.une .it{flex:0 0 100%;scroll-snap-align:start;position:relative;background-size:cover;background-position:center;cursor:pointer;border:0;padding:0;text-align:left;color:#fff;font:inherit}
.une .it .t{position:absolute;left:0;right:0;bottom:0;padding:34px 16px 14px;background:linear-gradient(transparent,#000b)}
.une .it .t b{display:block;font-size:18px;line-height:1.2}.une .it .t span{font-size:12.5px;opacity:.92}
.une .it .emo{position:absolute;top:26px;left:0;right:0;text-align:center;font-size:58px}
.une .it .lb{position:absolute;top:10px;left:12px;background:#fff;color:#0f172a;font-size:11px;font-weight:800;border-radius:999px;padding:3px 9px}
.une .dots{position:absolute;bottom:9px;right:12px;display:flex;gap:5px}.une .dots i{width:7px;height:7px;border-radius:50%;background:#fff8}.une .dots i.on{background:#fff}
.bp{display:flex;gap:12px;align-items:flex-start}.bp img,.bp .ic{width:64px;height:64px;flex:0 0 64px;border-radius:12px;object-fit:cover;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:30px}
.bp .code{display:inline-block;font-family:ui-monospace,monospace;font-weight:800;letter-spacing:1px;border:2px dashed var(--brand);border-radius:8px;padding:3px 8px;margin:6px 6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px 8px;text-align:center;cursor:pointer;box-shadow:var(--sh);font:600 11.5px system-ui,sans-serif;color:var(--ink);line-height:1.2;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile i{font-style:normal;font-size:26px;line-height:1}
.tile:active{transform:scale(.97)}
.grps.hd{display:none}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;color:var(--ink);font:inherit}
.srow:hover{background:var(--brand2);border-radius:10px}.srow .si{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--brand2)}
.srow .st{flex:1;min-width:0}.srow .st b{display:block;font-size:14px}.srow .st small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srow .sa{color:var(--mute);font-size:20px}
@media(max-width:639px){main #navdd{position:fixed;left:8px;right:8px;bottom:84px;margin:0;z-index:59;max-height:65vh;overflow:auto;border-radius:18px;animation:ddUp .18s ease-out}#navdd .grp{margin:0;box-shadow:0 -10px 40px -10px #0008}#navdd .gt{display:grid!important;grid-template-columns:repeat(3,1fr)!important;margin:0!important;padding:0!important;-webkit-mask-image:none!important;mask-image:none!important}#navdd .tile{flex:none!important}}
@keyframes ddUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#navdd{position:relative;z-index:40;margin:-6px 0 14px;animation:ddIn .15s ease-out}#navdd .grp{box-shadow:0 18px 40px -18px #0f172a66}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media(min-width:640px){nav#nav{flex-wrap:nowrap}nav#nav button{padding:9px 9px;font-size:12.5px}nav#nav button[data-t=reglages]{margin-left:auto}nav#nav button[data-t=reglages] .lg{display:none}nav#nav button[data-t=reglages] i{margin:0;font-size:17px}}
nav button.dd{background:var(--brand2);color:var(--ink)}
.grps{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px}
@media(min-width:720px){.grps{grid-template-columns:1fr 1fr}.grps .grp[data-g=avantages]{grid-column:1/-1}}
.grp{margin:0;min-width:0;padding:12px 14px 14px;border-top:3px solid var(--gc)}

.grp .gn{margin-left:auto;font-size:11px;font-weight:700;color:var(--gc);background:color-mix(in srgb,var(--gc) 12%,transparent);border-radius:9px;padding:2px 8px}
.grp .gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.grp .tile{min-height:0;padding:10px 4px 9px;border-radius:14px;box-shadow:none;background:color-mix(in srgb,var(--gc) 5%,var(--card));border-color:color-mix(in srgb,var(--gc) 18%,var(--line));transition:transform .12s,box-shadow .12s,border-color .12s}
.grp .tile i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--gc) 14%,transparent);margin-bottom:2px}
.grp .tile:hover{transform:translateY(-2px);border-color:var(--gc);box-shadow:0 8px 18px -10px var(--gc)}
@media(max-width:639px){.grp:not(.big) .gt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;margin:0 -14px;padding:2px 14px 4px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}.grp:not(.big) .gt::-webkit-scrollbar{display:none}.grp:not(.big) .tile{flex:0 0 84px;scroll-snap-align:start}}
.tile .n{position:absolute;top:4px;right:6px;min-width:18px;padding:0 5px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px}
.tile .n.i{background:var(--brand)}
.ph{width:100%;max-height:170px;object-fit:cover;border-radius:14px;margin:4px 0 8px;display:block;background:var(--line)}
.ph.s{width:76px;height:76px;flex:0 0 76px;margin:0 10px 0 0;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.card.fi{padding:0}.fi summary{padding:15px 18px;cursor:pointer;font-size:15px;list-style:none}.fi summary::-webkit-details-marker{display:none}.fi summary::after{content:'›';float:right;transition:transform .2s;font-size:20px;line-height:1}.fi[open] summary::after{transform:rotate(90deg)}.fi .fic{padding:0 18px 14px;font-size:14px;line-height:1.55}.fi .fic ul{padding-left:20px;margin:6px 0}.fi .fic li{margin:4px 0}.fi .fic a{color:var(--brand)}
.fq{border-top:1px solid var(--line)}.fq summary{padding:10px 0;cursor:pointer;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:600 13px system-ui,sans-serif;cursor:pointer;background:var(--card);color:var(--ink)}
.chip input{width:auto;margin:0}
html.dark{--bg:#0b1120;--card:#111a2e;--ink:#e5e9f2;--mute:#94a3b8;--line:#22304a;--brand2:#1e2a4a;--okb:#064e3b;--ok:#6ee7b7;--warnb:#451a03;--warn:#fcd34d;--badb:#450a0a;--bad:#fca5a5;--sh:0 1px 2px #0006,0 10px 28px -14px #000a;color-scheme:dark}
html.dark .btn{background:#17223a;color:var(--ink);border-color:var(--line)}
html.dark label{color:#cbd5e1}html.dark .btn.p{background:linear-gradient(135deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff}
html.dark input,html.dark select,html.dark textarea{background:#0f172a;border-color:#2a3a58;color:var(--ink)}
html.dark #sheet{background:var(--card);color:var(--ink)}
html.dark nav button:hover{background:#1b2742}
html.dark .logo{background:#fff}
html.dark [style*="background:#f1f5f9"]{background:#1b2742!important;color:var(--ink)!important}
html.dark [style*="background:#fff"]:not(.logo):not(img){background:var(--card)!important}

html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;padding:20px 16px 70px}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:#ffffff14;pointer-events:none}
header::before{width:280px;height:280px;right:-70px;top:-120px}
header::after{width:180px;height:180px;left:-60px;bottom:-110px;background:#ffffff0d}
header .in{position:relative;max-width:880px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:14px;min-width:0}
.logo{flex:0 0 auto;width:60px;height:60px;border-radius:18px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 22px -8px #0008;overflow:hidden}
.logo img{width:84%;height:84%;object-fit:contain}
header small{display:block;opacity:.85;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}

@media(min-width:640px){nav{flex-wrap:wrap;overflow:visible}}
@media(max-width:639px){nav{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}nav.end{-webkit-mask-image:none;mask-image:none}}
nav button{flex:0 0 auto;border:0;background:none;padding:9px 13px;border-radius:12px;font:600 13px system-ui,sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
nav button:hover{background:#f1f4f9;color:var(--ink)}
nav button.on{background:var(--brand);color:#fff;box-shadow:0 6px 14px -6px var(--brand)}
nav button{position:relative}nav button i{font-style:normal;margin-right:5px}nav .sm{display:none}
@media(max-width:639px){nav#nav{position:fixed;left:8px;right:8px;bottom:8px;z-index:60;margin:0;padding:5px;overflow:visible;flex-wrap:nowrap;justify-content:space-around;-webkit-mask-image:none;mask-image:none;box-shadow:0 -4px 22px -8px #0005;padding-bottom:calc(5px + env(safe-area-inset-bottom))}nav#nav button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:10px;letter-spacing:-.2px}nav#nav button i{font-size:19px;margin:0}nav .lg{display:none}nav#nav button.nbar{display:none}nav .sm{display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%}nav#nav .n{position:absolute;top:1px;right:calc(50% - 22px);margin:0}body{padding-bottom:86px}}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.card h3{font-size:14px;margin:14px 0 6px;color:var(--brand-d)}
.mute{color:var(--mute);font-size:13px}
.kpis{margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--brand)}
.kpi:nth-child(2)::before{background:#f59e0b}.kpi:nth-child(3)::before{background:#0ea5e9}.kpi:nth-child(4)::before{background:#10b981}
.kpi b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.02em}
.kpi span{color:var(--mute);font-size:12px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .r{text-align:right;white-space:nowrap;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-left:4px;vertical-align:middle}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}.info{background:var(--brand2);color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:12px;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:transform .1s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand-d));border-color:transparent;color:#fff;box-shadow:0 8px 18px -10px var(--brand)}
.btn.s{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #d5dce8;border-radius:12px;font:15px system-ui,sans-serif;background:#f8fafc;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand2);background:#fff}
textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}header h1{font-size:21px}.logo{width:52px;height:52px;border-radius:15px}}
.empty{color:var(--mute);font-size:14px;padding:6px 0}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.year{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}

.hc{display:inline-flex;align-items:center;gap:5px;background:#ffffff26;color:#fff;border:1px solid #ffffff33;border-radius:999px;padding:4px 11px;font:600 12.5px system-ui,sans-serif;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
button.hc{cursor:pointer}button.hc:hover{background:#ffffff3d}
@media(max-width:639px){.hchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}.hchips::-webkit-scrollbar{display:none}.hc{flex:0 0 auto;max-width:none}}
.v11-sec{margin:0 0 6px}.v11-st{display:flex;align-items:center;gap:8px;margin:18px 2px 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.v11-st span{font-size:16px}.v11-st::after{content:"";flex:1;height:1px;background:var(--line)}
.v11-sec.faire .v11-st{color:#c2410c}html.dark .v11-sec.faire .v11-st{color:#fdba74}
.v11-annee{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:linear-gradient(135deg,#1e3a8a,#7c3aed);color:#fff;border:0;font:inherit}
.v11-annee>span:first-child{font-size:34px;animation:v11bob 2.4s ease-in-out infinite}.v11-annee .mute{color:#ffffffcc}.v11-annee .sa{margin-left:auto;font-size:26px}
.v11-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.v11-ring{display:flex;align-items:center;gap:16px}.v11-ring svg{flex:0 0 auto;color:var(--ink)}
.v11-arc{animation:v11arc 1.1s cubic-bezier(.2,.8,.2,1)}@keyframes v11arc{from{stroke-dashoffset:var(--L)}}
.v11-pin{text-align:center;max-width:420px;margin:20px auto}.v11-pin h2{justify-content:center}.v11-pin .btn{display:block;margin:0 auto}
.v11-sw{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.v11-sw:first-of-type{border-top:0}
.v11-sw input{width:auto;margin:3px 0 0}.v11-sw b{display:block;font-size:14px}.v11-sw small{display:block;color:var(--mute);font-size:12.5px}
.v11-mic{margin:-4px 0 10px}.v11-mic.rec{background:#fee2e2;color:#b91c1c;border-color:#fecaca;animation:v11pul 1s ease-in-out infinite}
.v11-ecoute{margin:0 0 10px}
@keyframes v11pul{50%{opacity:.55}}@keyframes v11bob{50%{transform:translateY(-4px) rotate(-6deg)}}
#h-act{margin-left:auto;display:flex;gap:8px;align-items:center}#h-act #h-aa{margin-left:0!important}
#h-cloche,#h-moi{position:relative;background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:12px;height:34px;min-width:38px;padding:0 9px;font:700 15px system-ui;cursor:pointer}
#h-moi{border-radius:50%;width:36px;height:36px;min-width:36px;padding:0;font-size:13px;letter-spacing:.02em;background:#fff;color:var(--brand)}
#h-cloche span{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;padding:0 4px;border:2px solid var(--brand)}
#h-cloche:hover{animation:v11wig .5s}
.srow .st small{white-space:normal}
/* Emojis qui bougent */
.tile:hover i,.tile:focus-visible i{animation:v11wig .5s ease}nav#nav button:hover i{animation:v11wig .5s ease}
@keyframes v11wig{20%{transform:rotate(-12deg) scale(1.12)}40%{transform:rotate(10deg) scale(1.12)}60%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}}
/* Transitions entre pages */
#app.pg-f{animation:v11f .28s ease-out}#app.pg-b{animation:v11b .28s ease-out}
@keyframes v11f{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}@keyframes v11b{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
/* Chargement en douceur */
.sk{border-radius:16px;background:linear-gradient(90deg,var(--line) 25%,color-mix(in srgb,var(--line) 40%,var(--card)) 50%,var(--line) 75%);background-size:300% 100%;animation:v11sk 1.3s linear infinite;margin-bottom:12px}
.sk-h{height:54px}.sk-c{height:88px}.sk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sk-t{height:74px;margin:0}
@keyframes v11sk{from{background-position:100% 0}to{background-position:0 0}}
/* Pages vides plus parlantes */
#app .empty::before{content:"📭";display:block;font-size:36px;margin-bottom:6px;animation:v11bob 3s ease-in-out infinite}
/* V.11.3 : scènes animées */
#app .empty[data-sc]::before{content:none}
.v11sc{display:block;width:132px;height:96px;margin:0 auto 8px}
.v11sc .b{fill:var(--brand,#1d4ed8)}.v11sc .bl{fill:color-mix(in srgb,var(--brand,#1d4ed8) 18%,var(--card,#fff))}.v11sc .ln{stroke:var(--mute,#64748b);stroke-width:2.5;fill:none;stroke-linecap:round}.v11sc .y{fill:#f59e0b}.v11sc .g{fill:#10b981}.v11sc .r{fill:#ef4444}.v11sc .w{fill:var(--card,#fff)}.v11sc .gr{fill:color-mix(in srgb,var(--mute,#64748b) 30%,var(--card,#fff))}
.v11sc .a1{animation:sc-tombe 3.2s ease-in infinite;transform-box:fill-box}
.v11sc .a2{animation:sc-drapeau 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}
.v11sc .a3{animation:sc-balance 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
.v11sc .a4{animation:sc-brille 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.v11sc .a4.d{animation-delay:.9s}
.v11sc .a5{animation:sc-leve 4s ease-in-out infinite;transform-box:fill-box}
.v11sc .a6{animation:sc-nuage 7s linear infinite}
.v11sc .a7{animation:sc-sort 2.6s ease-in-out infinite;transform-box:fill-box}
.v11sc .a8{animation:sc-tour 4s linear infinite;transform-box:view-box;transform-origin:66px 50px}
.v11sc .a8.v{animation-duration:48s}
.v11sc .a9{animation:sc-roule 3.4s ease-in-out infinite}
.v11sc .a10{animation:sc-tour 1.1s linear infinite;transform-box:fill-box;transform-origin:center}
.v11sc .a11{animation:sc-couvercle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}
.v11sc .a12{animation:sc-loupe 3s ease-in-out infinite}
.v11sc .a13{animation:sc-zz 2.6s ease-in-out infinite;transform-box:fill-box}.v11sc .a13.d{animation-delay:1.3s}
@keyframes sc-tombe{0%{transform:translateY(-40px);opacity:0}25%{opacity:1}55%,100%{transform:translateY(0);opacity:1}70%,100%{opacity:0}}
@keyframes sc-drapeau{0%,50%{transform:rotate(0)}62%,90%{transform:rotate(-80deg)}100%{transform:rotate(0)}}
@keyframes sc-balance{50%{transform:rotate(-7deg)}0%,100%{transform:rotate(7deg)}}
@keyframes sc-brille{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.1);opacity:1}}
@keyframes sc-leve{0%,100%{transform:translateY(8px)}50%{transform:translateY(-4px)}}
@keyframes sc-nuage{from{transform:translateX(-30px)}to{transform:translateX(150px)}}
@keyframes sc-sort{0%,100%{transform:translateY(10px)}50%{transform:translateY(-8px)}}
@keyframes sc-tour{to{transform:rotate(360deg)}}
@keyframes sc-roule{0%{transform:translateX(-26px)}50%{transform:translateX(26px)}100%{transform:translateX(-26px)}}
@keyframes sc-couvercle{0%,40%,100%{transform:rotate(0)}55%{transform:rotate(-28deg)}70%{transform:rotate(-8deg)}}
@keyframes sc-loupe{0%,100%{transform:translate(-14px,4px)}50%{transform:translate(14px,-4px)}}
@keyframes sc-zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
html.v11-calme .v11sc *,html.v11-calme #v11-avion{animation:none!important}
/* V.11.3.5 : économies, quota, agenda, finitions */
.v113-eco{display:inline-flex;align-items:center;gap:6px;margin-top:6px;background:#dcfce7;color:#166534;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
html.dark .v113-eco{background:#14532d;color:#bbf7d0}
.v113-q{display:flex;align-items:center;gap:10px;margin-top:6px}.v113-q svg{width:44px;height:44px;flex:0 0 auto}
.v113-q .fd{fill:none;stroke:var(--line);stroke-width:6}.v113-q .av{fill:none;stroke:var(--brand,#1d4ed8);stroke-width:6;stroke-linecap:round;stroke-dasharray:var(--v) var(--c);animation:v113ring 1s cubic-bezier(.2,.8,.2,1)}.v113-q .av.plein{stroke:var(--bad,#dc2626)}
.v113-q text{font:800 10.5px system-ui,sans-serif;fill:var(--ink)}
@keyframes v113ring{from{stroke-dasharray:0 var(--c)}}
.v113-abo{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--brand) 8%,var(--card))}.v113-abo .e{font-size:30px}
.v113-cadeau{background:linear-gradient(120deg,var(--card) 55%,#fef3c7)}
html.dark .v113-cadeau{background:linear-gradient(120deg,var(--card) 55%,#78350f)}
.v113-cadeau .g{font-size:1.35em;display:inline-block;animation:v113gift 2.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes v113gift{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-14deg) scale(1.08)}72%{transform:rotate(12deg) scale(1.08)}79%{transform:rotate(-8deg)}86%{transform:rotate(5deg)}}
#une{position:relative}.v113-neige{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:2}
.v113-neige i{position:absolute;top:-14px;color:#fff;font-style:normal;opacity:.85;text-shadow:0 0 4px #0003;animation:v113flo 6s linear infinite}
@keyframes v113flo{to{transform:translate(18px,240px) rotate(240deg)}}
/* Cartes en cascade, effet ressort, onglet qui glisse */
#app.pg-f>*,#app.pg-b>*{animation:v113up .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes v113up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn,.tile,.chip,.srow,nav button,.it{transition:transform .35s cubic-bezier(.34,1.8,.5,1),background .15s,color .15s,box-shadow .15s}
.btn:active,.tile:active,.chip:active,.srow:active,nav button:active,.it:active{transform:scale(.94);transition-duration:.08s}
#nav-ind{position:absolute;left:0;top:0;border-radius:12px;background:var(--brand);box-shadow:0 6px 14px -6px var(--brand);transition:transform .38s cubic-bezier(.34,1.4,.5,1),width .38s cubic-bezier(.34,1.4,.5,1),opacity .2s;pointer-events:none;z-index:0;opacity:0}
nav.v113n button{z-index:1}nav.v113n button.on{background:transparent!important;box-shadow:none!important}
/* En-tête : bulles en verre dépoli, dégradé qui respire doucement */
#h-chips .hc{backdrop-filter:blur(10px) saturate(1.4);-webkit-backdrop-filter:blur(10px) saturate(1.4);background:#ffffff26!important;border-color:#ffffff4d!important;box-shadow:inset 0 1px 0 #ffffff40,0 6px 16px -10px #0006}
header{background-size:180% 180%!important;animation:v113ciel 18s ease-in-out infinite alternate}
@keyframes v113ciel{from{background-position:0% 40%}to{background-position:100% 60%}}
html.v11-calme header,html.v11-calme .v113-cadeau .g,html.v11-calme .v113-neige,html.v11-calme #app>*{animation:none!important}html.v11-calme .v113-neige{display:none}
/* Avion en papier à l'envoi */
#v11-avion{position:fixed;left:0;top:0;z-index:9998;pointer-events:none;width:58px;height:58px;animation:sc-vol 1.6s cubic-bezier(.45,.05,.55,.95) forwards}
@keyframes sc-vol{0%{transform:translate(-70px,70vh) rotate(-20deg)}45%{transform:translate(45vw,40vh) rotate(-8deg)}70%{transform:translate(70vw,30vh) rotate(10deg) scale(.9)}100%{transform:translate(110vw,-10vh) rotate(-30deg) scale(.6)}}
/* Message réussi */
.msg.ok{animation:sc-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes sc-pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
/* Petit message (confettis) */
#v11-toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-30px);opacity:0;z-index:10000;background:#0f172a;color:#fff;border-radius:999px;padding:10px 18px;font:700 14px system-ui,sans-serif;box-shadow:0 12px 30px -10px #0008;transition:.3s cubic-bezier(.2,.8,.2,1);pointer-events:none;max-width:90vw;text-align:center}
#v11-toast.on{opacity:1;transform:translate(-50%,0)}
/* « Mon année CSE » */
#v11-story{position:fixed;inset:0;z-index:9000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 24px;transition:background .5s;user-select:none}
#v11-story .bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px}#v11-story .bars i{flex:1;height:3px;border-radius:3px;background:#ffffff4d;overflow:hidden}#v11-story .bars b{display:block;height:100%;width:0;background:#fff}
#v11-story .x{position:absolute;top:22px;right:14px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;line-height:1}
#v11-story .sl{max-width:520px;animation:v11f .4s ease-out}#v11-story .e{font-size:84px;margin-bottom:18px;animation:v11bob 2.6s ease-in-out infinite}
#v11-story .t{font:800 clamp(30px,8vw,54px)/1.1 system-ui,sans-serif;letter-spacing:-.02em}#v11-story .s{font-size:17px;opacity:.9;margin-top:12px}
#v11-story .btns{display:flex;flex-direction:column;gap:8px;margin-top:26px}#v11-story .btns .btn{background:#ffffff26;color:#fff;border:1px solid #ffffff4d}
h1,h2,.v11-st{font-family:"Bricolage Grotesque",system-ui,sans-serif}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

    var f = D.fiche || {}, P = D.pub || {}, logo = ($('h-logo') && $('h-logo').src) || '';
    var id = [['Nom', f.nom], ['Prénom', f.prenom], ['E-mail', f.email], ['Téléphone', f.phone], ['Adresse', f.address], ['Service', f.service], ['Équipe', f.equipe && f.equipe.groupe ? 'Groupe ' + f.equipe.groupe : '']].filter(function (x) { return x[1]; });
    var fam = (f.spouse && f.spouse.name ? [['Conjoint(e)', f.spouse.name, f.spouse.birthdate ? fd(f.spouse.birthdate) : '']] : []).concat((f.children || []).filter(function (k) { return k && k.name; }).map(function (k) { return ['Enfant', k.name, k.birthdate ? fd(k.birthdate) : '']; }));
    var M = D.messages, ml = Array.isArray(M) ? M : (M && M.liste) || [];
    var h = '<div class="hd">' + (logo ? '<img src="' + E(logo) + '" alt="">' : '') + '<div><h1>Mes données personnelles au CSE</h1><div>' + E((P.cse && P.cse.nom) || 'CSE') + ' · ' + E(f.nom || '') + '</div><div style="color:#555">Édité le ' + fd(today()) + ' (droit d\'accès, article 15 du RGPD)</div></div></div>'
      + '<h2>🪪 Identité</h2>' + mdTable(['Donnée', 'Valeur'], id)
      + '<h2>👨‍👩‍👧 Famille</h2>' + mdTable(['Lien', 'Nom', 'Naissance'], fam)
      + '<h2>🎟️ Achats de billets</h2>' + mdTable(['Date', 'Détail', 'Montant', 'Réglé'], (f.achats || []).map(function (a) { return [fd(a.date), a.desc, eur(a.total || 0), a.regle ? 'oui' : 'non']; }))
      + '<h2>🎁 Subventions reçues</h2>' + mdTable(['Date', 'Détail', 'Montant'], (f.offert || []).map(function (o) { return [fd(o.date), (o.type ? o.type + ' : ' : '') + (o.label || ''), eur(o.montant || 0)]; }))
      + '<h2>🎭 Sorties</h2>' + mdTable(['Date', 'Sortie', 'Invités', 'Montant'], (f.sorties || []).map(function (x) { return [fd(x.date), x.nom, (x.invites || []).map(function (g) { return g.name || g.nom || ''; }).join(', '), eur(x.montant || 0)]; }))
      + '<h2>⛺ Prêts de matériel</h2>' + mdTable(['Du', 'Au', 'Matériel', 'Statut'], (f.prets || []).map(function (x) { return [fd(x.debut), fd(x.fin), (Array.isArray(x.items) ? x.items.map(function (i) { return (i.qte || i.qty || 1) + ' × ' + (i.nom || i.name || ''); }).join(', ') : String(x.items || '')) || x.desc || '', x.statut || '']; }))
      + '<h2>🏖️ Chèques vacances</h2>' + mdTable(['Année', 'Valeur', 'Part du CSE', 'Ma part'], (f.cv || []).map(function (c) { return [c.annee, eur(c.total || 0), eur(c.cse || 0), eur(c.salarie || 0)]; }))
      + '<h2>🎁 Colis</h2>' + mdTable(['Distribution', 'Date', 'Remis'], (f.colis || []).map(function (c) { return [c.nom, fd(c.date), c.moi && c.moi.remis ? 'oui' : 'non']; }))
      + '<h2>📄 Documents</h2>' + mdTable(['Date', 'Document'], (f.documents || []).map(function (d) { return [fd(d.date), d.titre]; }))
      + '<h2>💬 Messages avec le CSE</h2>' + mdTable(['Date', 'De', 'Message'], ml.map(function (m) { return [fd(String(m.at || '').slice(0, 10)), m.de === 'cse' ? 'CSE' : 'Moi', (m.texte || '') + (m.pj ? ' 📎 ' + (m.pj.nom || '') : '')]; }))
      + '<h2>📨 Demandes</h2>' + mdTable(['Date', 'Demande', 'Statut'], (D.demandes || []).map(function (d) { return [fd(String(d.at || '').slice(0, 10)), d.resume || d.type, d.statut]; }))
      + (D.prefs ? '<h2>🔔 Alertes choisies</h2><p>' + E((D.prefs.cats || []).join(', ') || 'aucune') + '</p>' : '')
      + '<p style="margin-top:20px;color:#555;font-size:11px">Ces données sont utilisées par le CSE uniquement pour les activités sociales et culturelles. Pour les faire corriger, utilisez « Ma fiche » ; pour toute autre demande (effacement, opposition), écrivez au CSE.</p>';
    $('recap').innerHTML = h; document.body.classList.add('printing');
    var done = function () { document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); setTimeout(function () { window.print(); }, 200);
  };
  window.cseMesDonneesFichier = function () {
    var o = { edite: new Date().toISOString(), cse: ((D.pub || {}).cse || {}).nom || 'CSE', fiche: D.fiche || {}, messages: D.messages || [], demandes: D.demandes || [], alertes: D.prefs || null };
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' })); a.download = 'mes-donnees-cse-' + today() + '.json'; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  // ---------- V.10.3 : Mes droits (fiches, calculs, affichage, PV) et Aide et contacts (signalements, contacts, FAQ) ----------
  var SP = function (q) { return 'https://www.service-public.fr/particuliers/recherche?keyword=' + encodeURIComponent(q); }, CT = function (q) { return 'https://code.travail.gouv.fr/recherche?q=' + encodeURIComponent(q); };
  var FICHES = {
    'conges-payes': { t: '🏖️ Congés payés', k: 'vacances cp jours ouvrables ouvrés', h: '<p>Chaque mois de travail donne <b>2,5 jours ouvrables</b> de congés payés, soit <b>30 jours ouvrables (5 semaines) par an</b>. Les jours ouvrables vont du lundi au samedi (30 jours ouvrables = 25 jours ouvrés).</p><ul><li>L\'année de référence va en général du <b>1er juin au 31 mai</b> (un accord peut prévoir une autre période).</li><li>Comptent comme du travail : les congés payés, le congé maternité ou paternité, l\'accident du travail et la maladie professionnelle.</li><li><b>Arrêt maladie ordinaire</b> : depuis la loi du 22 avril 2024, il donne aussi des congés : <b>2 jours ouvrables par mois</b>, 24 jours au plus par an.</li><li>Le congé principal comprend au moins 12 jours ouvrables continus, pris entre le 1er mai et le 31 octobre. L\'employeur fixe l\'ordre des départs après avis du CSE.</li><li>Des jours de fractionnement peuvent s\'ajouter si une partie du congé principal est prise en dehors de cette période (sauf renonciation écrite).</li></ul>', s: [['Service-public : congés payés', SP('congés payés salarié')], ['Code du travail numérique', CT('congés payés')]], a: 'L3141-1 et suivants' },
    'jours-feries': { t: '📅 Jours fériés', k: 'ferie pont 1er mai solidarite pentecote', h: '<p>Il y a <b>11 jours fériés</b> : 1er janvier, lundi de Pâques, 1er mai, 8 mai, Ascension, lundi de Pentecôte, 14 juillet, 15 août, 1er novembre, 11 novembre et 25 décembre (2 de plus en Alsace-Moselle).</p><ul><li><b>Seul le 1er mai</b> est obligatoirement chômé et payé. S\'il est travaillé (activité qui ne peut pas s\'arrêter), il est payé double.</li><li>Les autres jours fériés sont chômés ou non selon la convention collective, un accord ou l\'usage de l\'entreprise.</li><li>Un jour férié chômé ne fait pas perdre de salaire au salarié qui a au moins 3 mois d\'ancienneté.</li><li>La <b>journée de solidarité</b> (souvent le lundi de Pentecôte) est une journée de 7 heures travaillée sans être payée en plus.</li></ul>', s: [['Service-public : jours fériés', SP('jours fériés salarié')]], a: 'L3133-1 et suivants' },
    'evenements': { t: '💍 Congés pour événements familiaux', k: 'mariage pacs naissance deces deuil enfant absence autorisee', h: '<p>Ces jours sont <b>payés</b> comme du travail et ne sont pas pris sur les congés payés. Ils se prennent au moment de l\'événement, avec un justificatif. Minimums de la loi :</p><ul><li>Mariage ou PACS du salarié : <b>4 jours</b></li><li>Mariage d\'un enfant : <b>1 jour</b></li><li>Naissance ou arrivée d\'un enfant adopté : <b>3 jours</b></li><li>Décès d\'un enfant : <b>5 jours</b> (7 jours ouvrés si l\'enfant avait moins de 25 ans), plus un congé de deuil de 8 jours</li><li>Décès du conjoint, du partenaire de PACS ou du concubin : <b>3 jours</b></li><li>Décès du père, de la mère, d\'un beau-parent, d\'un frère ou d\'une sœur : <b>3 jours</b></li><li>Annonce d\'un handicap, d\'une maladie chronique ou d\'un cancer chez un enfant : <b>5 jours</b></li></ul><p>La convention collective peut prévoir plus.</p>', s: [['Service-public : congés pour événements familiaux', SP('congé pour événement familial')]], a: 'L3142-1 et suivants' },
    'paternite': { t: '👶 Naissance : congé de paternité', k: 'paternite naissance bebe second parent', h: '<p>Le père ou le second parent a droit à <b>3 jours de congé de naissance</b> (payés par l\'employeur), puis à un <b>congé de paternité de 25 jours</b> calendaires (32 jours pour des naissances multiples).</p><ul><li>4 jours de paternité doivent être pris tout de suite après les 3 jours de naissance.</li><li>Les 21 jours restants se prennent dans les 6 mois, en 1 ou 2 fois (au moins 5 jours à chaque fois).</li><li>Prévenez l\'employeur au moins 1 mois avant.</li><li>Pendant le congé de paternité, la Sécurité sociale verse des indemnités journalières.</li></ul>', s: [['Service-public : congé de paternité', SP('congé de paternité salarié')]], a: 'L1225-35' },
    'maladie': { t: '🤒 Arrêt maladie', k: 'arret maladie carence indemnites ij cpam', h: '<ul><li>Envoyez l\'arrêt <b>dans les 48 heures</b> : les volets 1 et 2 à la CPAM (souvent fait par le médecin en ligne), le volet 3 à l\'employeur.</li><li>La Sécurité sociale verse des indemnités journalières après un <b>délai de carence de 3 jours</b>.</li><li>Avec au moins 1 an d\'ancienneté, l\'employeur complète ces indemnités (délai de 7 jours dans la loi ; la convention collective est souvent plus favorable).</li><li>Respectez les heures de sortie autorisées : une contre-visite médicale est possible.</li><li>Après 60 jours d\'arrêt, une <b>visite de reprise</b> avec la médecine du travail est obligatoire.</li><li>L\'arrêt maladie donne des congés payés (2 jours par mois, voir la fiche Congés payés).</li></ul>', s: [['Service-public : arrêt maladie', SP('arrêt maladie salarié indemnités')]], a: 'L1226-1' },
    'accident': { t: '🩹 Accident du travail', k: 'accident travail trajet at maladie professionnelle declaration', h: '<ul><li>Prévenez l\'employeur <b>dans les 24 heures</b> (sauf impossibilité), même pour un accident qui paraît léger, et faites-le noter.</li><li>L\'employeur doit le déclarer à la CPAM sous 48 heures et vous remettre une <b>feuille d\'accident</b> : les soins sont alors pris en charge sans avance de frais.</li><li>La journée de l\'accident est payée par l\'employeur. Les indemnités journalières sont versées dès le lendemain, <b>sans délai de carence</b>.</li><li>L\'accident de trajet (domicile ↔ travail) est aussi couvert.</li><li>Pendant l\'arrêt, le contrat est protégé : le licenciement est très encadré.</li><li>N\'hésitez pas à prévenir un élu du CSE.</li></ul>', s: [['Service-public : accident du travail', SP('accident du travail salarié')]], a: 'L1226-7 et suivants' },
    'heures-sup': { t: '⏱️ Heures supplémentaires', k: 'heures supplementaires majoration 35 heures repos compensateur', h: '<p>Ce sont les heures faites <b>au-delà de 35 heures par semaine</b>, à la demande ou avec l\'accord de l\'employeur.</p><ul><li>Majoration par défaut : <b>+25 %</b> de la 36e à la 43e heure, <b>+50 %</b> au-delà. Un accord peut prévoir un autre taux (au moins 10 %).</li><li>Elles peuvent être remplacées en tout ou partie par du repos (repos compensateur de remplacement) si un accord le prévoit.</li><li>Durées maximales : 10 heures par jour, 48 heures sur une semaine et 44 heures en moyenne sur 12 semaines (sauf dérogations).</li><li>Les heures supplémentaires apparaissent sur la fiche de paie.</li></ul>', s: [['Service-public : heures supplémentaires', SP('heures supplémentaires salarié')]], a: 'L3121-27 et suivants' },
    'nuit': { t: '🌙 Travail de nuit', k: 'nuit poste equipe 21h 6h travailleur de nuit', h: '<p>Le travail de nuit est celui fait entre <b>21 heures et 6 heures</b> (un accord peut fixer une autre période de 9 heures comprenant minuit à 5 heures).</p><ul><li>Vous êtes <b>travailleur de nuit</b> si vous faites au moins 3 heures de nuit 2 fois par semaine, ou un nombre d\'heures de nuit fixé par accord sur l\'année (270 heures sur 12 mois par défaut).</li><li>Le travailleur de nuit a droit à un <b>repos compensateur</b> et, selon l\'accord, à une majoration de salaire.</li><li>Pas plus de 8 heures par nuit et 40 heures par semaine en moyenne sur 12 semaines (sauf accord).</li><li>Suivi médical renforcé : visite avant d\'être affecté de nuit, puis suivi régulier.</li><li>Priorité pour un poste de jour qui se libère, et possibilité de repasser de jour pour raisons familiales graves.</li></ul>', s: [['Service-public : travail de nuit', SP('travail de nuit salarié')]], a: 'L3122-1 et suivants' },
    'pauses': { t: '☕ Pauses et temps de repos', k: 'pause repos 20 minutes 11 heures dimanche hebdomadaire', h: '<ul><li><b>Pause</b> : au moins 20 minutes dès que le travail atteint 6 heures dans la journée.</li><li><b>Repos quotidien</b> : au moins 11 heures de suite entre deux journées de travail.</li><li><b>Repos hebdomadaire</b> : au moins 24 heures de suite, qui s\'ajoutent aux 11 heures (35 heures de suite), en principe le dimanche (dérogations possibles, notamment pour le travail en équipes successives).</li><li>La pause est payée seulement si la convention ou l\'usage le prévoit, ou si vous restez à disposition de l\'employeur.</li></ul>', s: [['Service-public : temps de pause', SP('temps de pause salarié')]], a: 'L3121-16, L3131-1, L3132-2' },
    'retrait': { t: '🛑 Droit d\'alerte et de retrait', k: 'danger grave imminent retrait alerte securite machine', h: '<p>Si vous avez un <b>motif raisonnable de penser</b> qu\'une situation présente un <b>danger grave et imminent</b> pour votre vie ou votre santé (ou si un système de protection est défaillant) :</p><ul><li><b>Alertez</b> tout de suite votre responsable (oralement, puis par écrit si possible).</li><li>Vous pouvez <b>vous retirer</b> de cette situation sans l\'accord de l\'employeur.</li><li>Aucune sanction ni retenue de salaire n\'est possible si le motif était raisonnable.</li><li>Votre retrait ne doit pas créer un nouveau danger pour les autres.</li><li>Les élus du CSE ont aussi un droit d\'alerte : prévenez-les, ils consignent le danger dans un registre spécial.</li></ul>', s: [['Service-public : droit de retrait', SP('droit de retrait salarié')]], a: 'L4131-1 et suivants' },
    'harcelement': { t: '🤝 Harcèlement moral et sexuel', k: 'harcelement moral sexuel sexiste agissement referent discrimination', h: '<ul><li><b>Harcèlement moral</b> : des agissements <b>répétés</b> qui dégradent les conditions de travail et peuvent porter atteinte aux droits, à la dignité, à la santé ou à l\'avenir professionnel.</li><li><b>Harcèlement sexuel</b> : des propos ou comportements à connotation sexuelle ou sexiste répétés, ou une pression grave, même unique, pour obtenir un acte sexuel.</li><li>La victime et les <b>témoins</b> sont protégés : aucune sanction ni mesure discriminatoire pour avoir signalé ou témoigné de bonne foi.</li><li>Gardez des traces (messages, dates, témoins) et parlez-en : élus du CSE, référent harcèlement, médecine du travail, inspection du travail, Défenseur des droits (09 69 39 00 00).</li><li>Vous pouvez faire un signalement, même anonyme, depuis l\'onglet « Aide et contacts ».</li></ul>', s: [['Service-public : harcèlement au travail', SP('harcèlement moral travail')]], a: 'L1152-1, L1153-1' },
    'medecine': { t: '🩺 Visites médicales', k: 'medecine du travail visite reprise embauche', h: '<ul><li><b>À l\'embauche</b> : visite d\'information et de prévention dans les 3 mois (avant la prise de poste pour le travail de nuit et les postes à risques).</li><li><b>Ensuite</b> : au moins tous les 5 ans (plus souvent en suivi renforcé).</li><li><b>Visite de reprise</b> obligatoire après un congé maternité, un accident du travail d\'au moins 30 jours, une maladie non professionnelle d\'au moins 60 jours ou une maladie professionnelle.</li><li>Une <b>visite de pré-reprise</b> est possible pendant un long arrêt, pour préparer le retour.</li><li>Vous pouvez demander une visite <b>à tout moment</b>, sans passer par l\'employeur.</li><li>Les visites ont lieu pendant le temps de travail.</li></ul>', s: [['Service-public : médecine du travail', SP('visite médicale médecine du travail')]], a: 'R4624-10 et suivants' },
    'cpf': { t: '🎓 Compte personnel de formation (CPF)', k: 'cpf formation compte euros moncompteformation', h: '<ul><li>Le CPF est crédité de <b>500 € par an</b> (jusqu\'à 5 000 €), ou 800 € par an (jusqu\'à 8 000 €) pour les salariés peu qualifiés.</li><li>Tout se fait sur <b>moncompteformation.gouv.fr</b> (connexion avec FranceConnect+).</li><li>Une formation suivie <b>hors temps de travail</b> ne demande pas l\'accord de l\'employeur. Sur le temps de travail, il faut demander son accord à l\'avance.</li><li>Une participation forfaitaire (environ 100 €) est demandée, sauf exceptions (demandeurs d\'emploi, abondement de l\'employeur…).</li><li>Attention aux arnaques : personne n\'a besoin de vos identifiants.</li></ul>', s: [['Mon compte formation', 'https://www.moncompteformation.gouv.fr'], ['Service-public : CPF', SP('compte personnel de formation')]], a: 'L6323-1 et suivants' },
    'entretien-pro': { t: '🗣️ Entretien professionnel', k: 'entretien professionnel evolution carriere formation', h: '<p>C\'est un entretien avec l\'employeur sur <b>vos perspectives d\'évolution</b> (formation, qualification, métier). Ce n\'est pas une évaluation de votre travail.</p><ul><li>Il doit être proposé régulièrement, et à votre retour de certaines absences (congé maternité, congé parental, longue maladie…).</li><li>Un bilan de votre parcours est fait périodiquement : il vérifie que vous avez eu des entretiens et des formations.</li><li>Une réforme de fin 2025 change le rythme de ces entretiens : consultez la fiche à jour de service-public.fr ou demandez à un élu.</li></ul>', s: [['Service-public : entretien professionnel', SP('entretien professionnel salarié')]], a: 'L6315-1' },
    'demission': { t: '✉️ Démission', k: 'demission preavis depart quitter chomage abandon de poste', h: '<ul><li>La démission doit exprimer une volonté <b>claire</b> de quitter l\'entreprise. Un écrit est conseillé (lettre recommandée ou remise en main propre contre signature).</li><li>Un <b>préavis</b> est en général dû : sa durée dépend de la convention collective, d\'un accord ou des usages (voir le calcul « Fin de préavis »). L\'employeur peut vous en dispenser.</li><li>En principe, pas d\'allocations chômage, sauf démission jugée légitime ou démission pour un projet de reconversion validé (conditions à vérifier avant).</li><li>Depuis 2023, un <b>abandon de poste</b> peut être considéré comme une démission après une mise en demeure restée sans réponse.</li><li>Avant de démissionner, parlez-en à un élu : une rupture conventionnelle est parfois possible.</li></ul>', s: [['Service-public : démission', SP('démission salarié préavis')]], a: 'L1237-1' },
    'paie': { t: '🧾 Comprendre ma fiche de paie', k: 'bulletin salaire paie brut net cotisations csg crds impot prelevement source net social', h: '<p>Le bulletin se lit <b>de haut en bas</b> : on part du salaire brut, on retire les cotisations, puis l\'impôt.</p><ul><li><b>Salaire de base</b> : votre salaire mensuel (ou taux horaire × heures). S\'y ajoutent les <b>heures supplémentaires</b>, les <b>primes</b> (nuit, équipe, ancienneté…) et s\'y retirent les <b>absences</b> non payées. Le total donne le <b>salaire brut</b>.</li><li><b>Cotisations</b> : regroupées par risque (santé, accidents du travail, retraite, famille, assurance chômage). La colonne « part salarié » est retirée de votre brut ; la « part employeur » est payée en plus par l\'entreprise.</li><li><b>Mutuelle et prévoyance</b> : votre part apparaît dans les cotisations « Santé » et « Prévoyance ».</li><li><b>CSG et CRDS</b> : contributions sociales calculées sur presque tout le brut. Une partie de la CSG est déductible de l\'impôt, l\'autre non.</li><li><b>Heures supplémentaires</b> : elles ont une réduction de cotisations salariales et sont exonérées d\'impôt sur le revenu dans une limite annuelle (7 500 € nets).</li><li><b>Net à payer avant impôt</b> : ce que vous toucheriez sans le prélèvement à la source.</li><li><b>Impôt sur le revenu</b> : prélevé à la source avec le taux transmis par les impôts (taux neutre si vous n\'en avez pas). Pour le changer : impots.gouv.fr, pas l\'employeur.</li><li><b>Net payé</b> : ce qui arrive sur votre compte.</li><li><b>Montant net social</b> : sert à vos demandes de prime d\'activité ou de RSA. Utilisez ce chiffre-là.</li><li>En bas : vos <b>compteurs de congés</b> (acquis, pris, restants) et le cumul imposable de l\'année.</li></ul><p>Gardez vos bulletins <b>sans limite de durée</b> : ils servent pour votre retraite. Une erreur ? Signalez-la vite au service paie ; un élu peut vous aider.</p>', s: [['Service-public : bulletin de paie', SP('bulletin de paie mentions')], ['Code du travail numérique', CT('bulletin de paie')]], a: 'R3243-1 et suivants' },
    'rupture': { t: '🤝 Rupture conventionnelle', k: 'rupture conventionnelle indemnite homologation chomage', h: '<ul><li>Le contrat prend fin d\'un <b>commun accord</b> : ni l\'employeur ni le salarié ne peuvent l\'imposer.</li><li>Un ou plusieurs entretiens ont lieu. Vous pouvez vous faire <b>assister</b> (par exemple par un élu du CSE).</li><li>Après la signature, chacun a <b>15 jours calendaires</b> pour se rétracter. La convention est ensuite homologuée par l\'administration (DREETS).</li><li>L\'indemnité est au moins égale à l\'indemnité légale de licenciement (1/4 de mois de salaire par année d\'ancienneté jusqu\'à 10 ans, 1/3 au-delà), ou à celle de la convention si elle est plus favorable.</li><li>Elle ouvre droit aux allocations chômage.</li></ul>', s: [['Service-public : rupture conventionnelle', SP('rupture conventionnelle')]], a: 'L1237-11 et suivants' }

    sheet(head('Écrire au CSE') + '<label>Votre message</label><textarea id="w-t" style="min-height:120px"></textarea><div style="margin-top:12px"><button class="btn p" id="w-go">Envoyer</button></div><div id="w-msg"></div>');
    $('w-go').onclick = function () { var t = $('w-t').value.trim(); if (!t) return say('w-msg', 'Écrivez votre message.', 'bad'); send('message', { texte: t }, 'Message : ' + t.slice(0, 80), 'w-msg', 'w-go'); };
  };

  if (PUBLIC) cseIdeaPublic(); else load();
})();
</script>
