<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1e40af">
<link rel="manifest" href="espace-manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon CSE">
<title>Mon espace CSE</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#1d4ed8;--brand2:#dbeafe;--ok:#047857;--okb:#d1fae5;--warn:#b45309;--warnb:#fef3c7;--bad:#b91c1c;--badb:#fee2e2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:18px 16px 54px}
header .in{max-width:860px;margin:0 auto}
header small{opacity:.8;font-weight:600;letter-spacing:.02em}
header h1{margin:4px 0 0;font-size:22px}
main{max-width:860px;margin:-40px auto 40px;padding:0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--card);border-radius:14px;box-shadow:0 2px 10px #0f172a14;margin-bottom:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
@media(min-width:640px){nav{flex-wrap:wrap;overflow:visible}}
@media(max-width:639px){nav{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}nav.end{-webkit-mask-image:none;mask-image:none}}
nav button{flex:0 0 auto;border:0;background:none;padding:9px 12px;border-radius:10px;font:600 13px system-ui,sans-serif;color:var(--mute);cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand2);color:var(--brand)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;margin:14px 0 6px}
.mute{color:var(--mute);font-size:13px}
.kpis{margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.kpi b{display:block;font-size:20px;margin-top:2px}
.kpi span{color:var(--mute);font-size:12px;font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .r{text-align:right;white-space:nowrap;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:4px;vertical-align:middle}
.ok{background:var(--okb);color:var(--ok)}.warn{background:var(--warnb);color:var(--warn)}.bad{background:var(--badb);color:var(--bad)}.info{background:var(--brand2);color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;font:600 14px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.s{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
label{display:block;font-size:13px;font-weight:600;color:#334155;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font:15px system-ui,sans-serif;background:#f8fafc;color:var(--ink)}
textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.msg{padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;margin-top:10px}
.guest{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-top:6px}
.guest input{padding:8px}
.guest label{margin:0;font-weight:500;display:flex;gap:4px;align-items:center}
.guest label input{width:auto}
#overlay{position:fixed;inset:0;background:#0f172a99;display:none;align-items:flex-end;justify-content:center;z-index:9}
#overlay.on{display:flex}
#sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 24px}
@media(min-width:620px){#overlay{align-items:center}#sheet{border-radius:18px}}
#sheet h2{margin:0 0 4px;font-size:18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--mute);cursor:pointer}
.year{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.loading{text-align:center;padding:50px 10px;color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:12px;margin:20px 0}
</style>
</head>
<body>
<header><div class="in" style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><small id="h-cse">CSE</small><h1 id="h-nom">Mon espace CSE</h1></div><button id="h-inst" class="btn s" hidden style="background:#ffffff22;border-color:#ffffff66;color:#fff;flex:0 0 auto">📲 Installer l'appli</button></div></header>
<main>
  <nav id="nav" hidden></nav>
  <div id="app"><div class="card loading">Chargement de votre espace…</div></div>
  <footer id="foot"></footer>
</main>
<div id="overlay"><div id="sheet"></div></div>

<script>
(function () {
  'use strict';
  // --- Lien personnel : #u=<adresse du script en base64>&t=<code personnel> ---
  var H = new URLSearchParams(location.hash.replace(/^#/, ''));
  var U = H.get('u'), T = H.get('t');
  try {
    if (U && T) localStorage.setItem('cse_espace', JSON.stringify({ u: U, t: T }));
    else if (!(U && /(^|[#&])idees\b/.test(location.hash))) { var mem = JSON.parse(localStorage.getItem('cse_espace') || 'null'); if (mem) { U = mem.u; T = mem.t; } }
  } catch (e) { }
  var URLS = ''; try { URLS = atob(String(U || '').replace(/-/g, '+').replace(/_/g, '/')); } catch (e) { }
  var PUBLIC = !T && !!U && /(^|[#&])idees\b/.test(location.hash);
  var D = null, TAB = 'accueil', YEAR = String(new Date().getFullYear());

  // --- Mode démonstration (#demo) : salarié fictif, rien n'est envoyé ---
  var DEMO = /(^|[#&?])demo\b/.test(location.hash + location.search);
  function demoData() {
    var y = new Date().getFullYear(), t = today();
    function d(m, j, yy) { return (yy || y) + '-' + String(m).padStart(2, '0') + '-' + String(j).padStart(2, '0'); }
    function plus(n) { var x = new Date(); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
    return { ok: true, le: new Date().toISOString(),
      fiche: { id: 1, nom: 'EXEMPLE Camille', prenom: 'Camille', email: 'camille.exemple@exemple.fr', phone: '06 12 34 56 78', address: '12 rue des Lilas, 88000 Épinal', service: 'Production',
        children: [{ name: 'Léa Exemple', birthdate: '2015-04-12' }, { name: 'Hugo Exemple', birthdate: '2019-09-30' }], spouse: { name: 'Alex Exemple', birthdate: '1988-02-03' },
        achats: [{ date: d(10, 18), desc: '4 x Cinéma', total: 24, regle: true, mode: 'Carte Bancaire' }, { date: d(7, 2), desc: '2 x Parc Astérix', total: 70, regle: true, mode: 'Chèque' }, { date: d(11, 20), desc: '2 x Fraispertuis', total: 30, regle: false, mode: '' }, { date: d(12, 5, y - 1), desc: '3 x Cinéma', total: 18, regle: true, mode: 'Espèces' }],
        offert: [{ date: d(10, 18), label: 'Billets : 4 x Cinéma', montant: 12, type: 'Billetterie' }, { date: d(7, 2), label: 'Billets : 2 x Parc Astérix', montant: 40, type: 'Billetterie' }, { date: d(11, 20), label: 'Billets : 2 x Fraispertuis', montant: 18, type: 'Billetterie' }, { date: d(3, 15), label: 'Chèques vacances (part du CSE)', montant: 200, type: 'Chèques vacances' }, { date: d(12, 1), label: 'Bon de Noël', montant: 50, type: 'Œuvres sociales' }, { date: d(6, 10), label: 'Rentrée scolaire (Léa Exemple)', montant: 40, type: 'Œuvres sociales' }, { date: d(12, 10, y - 1), label: 'Bon de Noël', montant: 50, type: 'Œuvres sociales' }],
        cv: [{ annee: String(y), total: 500, cse: 200, salarie: 300, formats: 'Papier 300,00 € · Connect 200,00 €', livraison: '', echeances: [{ date: d(3, 15), montant: 100, mode: 'Prélèvement', statut: 'payé' }, { date: d(4, 15), montant: 100, mode: 'Prélèvement', statut: 'payé' }, { date: plus(-5), montant: 50, mode: 'Chèque', statut: 'reçu' }, { date: plus(20), montant: 50, mode: 'Chèque', statut: 'à venir' }] }],
        sorties: [{ regId: 11, outingId: 901, nom: 'Marché de Noël de Strasbourg', date: plus(12), lieu: 'Strasbourg', invites: [{ name: 'Alex Exemple', isChild: false }, { name: 'Léa Exemple', isChild: true }], montant: 45, regle: false, aRegler: 45 }, { regId: 10, outingId: 900, nom: 'Bowling', date: d(9, 14), lieu: 'Épinal', invites: [], montant: 5, regle: true, aRegler: 0 }],
        attente: [{ outingId: 903, nom: 'Concert au Zénith', date: plus(40), pos: 2 }],
        foyer: 4, pris: { 11: 4, 12: 2 }, cinePris: 4,
        idees: [{ date: plus(-20), type: 'sortie', texte: 'Pourquoi pas une sortie au parc Walygator l\'été prochain ?', statut: 'Retenue', reponse: 'Bonne idée, on la met au programme 2027 !' }],
        prets: [{ debut: plus(5), fin: plus(7), items: '4 x Tables pliantes, 8 x Bancs', statut: 'Réservé' }, { debut: d(8, 20), fin: d(8, 22), items: '1 x Chapiteau 3x6', statut: 'Rendu' }] },
      pub: { cse: { nom: 'CSE (exemple)', email: '' }, swile: { url: '', texte: 'Cinéma, parcs, spectacles : vos billets à prix CSE, avec la subvention déjà déduite.' }, cv: { ouvert: true, texte: 'Inscriptions ouvertes jusqu\'au 15 mars. Montant de 100 € à 600 €, participation du CSE selon le quotient familial.' },
        sorties: [{ id: 901, nom: 'Marché de Noël de Strasbourg', date: plus(12), lieu: 'Strasbourg', notes: 'Départ en car à 8 h du parking de l\'usine.', limite: plus(5), prix: { salarie: 15, adulte: 20, enfant: 10 }, places: 50, restantes: 12 },
          { id: 902, nom: 'Karting en famille', date: plus(26), lieu: 'Épinal', notes: '', limite: plus(18), prix: { salarie: 10, adulte: 25, enfant: 15 }, places: 30, restantes: 8 },
          { id: 903, nom: 'Concert au Zénith', date: plus(40), lieu: 'Nancy', notes: '', limite: plus(30), prix: { salarie: 20, adulte: 35, enfant: 35 }, places: 20, restantes: 0 }],
        materiel: [{ id: 1, nom: 'Tables pliantes', qte: 12, occupe: [{ d: plus(5), f: plus(7), q: 4 }] }, { id: 2, nom: 'Bancs', qte: 24, occupe: [{ d: plus(5), f: plus(7), q: 8 }] }, { id: 3, nom: 'Chapiteau 3x6', qte: 2, occupe: [] }, { id: 4, nom: 'Appareil à raclette', qte: 4, occupe: [] }],
        billets: [{ id: 11, titre: 'Cinéma Épinal', prix: 5.5, prixPublic: 11.9, stock: 23, expire: d(5, 2, y + 1), cinema: true }, { id: 13, titre: 'Cinéma Remiremont', prix: 5.5, prixPublic: 10.5, stock: 42, expire: d(5, 20, y + 1), cinema: true }, { id: 12, titre: 'Parc Astérix', prix: 35, prixPublic: 62, stock: 4, expire: d(10, 31, y + 1), cinema: false }, { id: 14, titre: 'Fraispertuis City', prix: 15, prixPublic: 29, stock: 18, expire: '', cinema: false }],
        quotas: { std: 2, stdFoyer: true, cine: 10, cineFoyer: false },
        reponses: [{ date: plus(-10), type: 'question', texte: 'Est-ce que les intérimaires ont droit à la billetterie ?', reponse: 'Non, la billetterie est réservée aux salariés de l\'entreprise, conformément au règlement intérieur du CSE.' }, { date: plus(-30), type: 'idee', texte: 'Mettre des places de cinéma moins chères.', reponse: 'Depuis octobre, la place de cinéma passe de 8 € à 6 €.' }],
        materielInfo: 'Retrait et retour le vendredi à la permanence du CSE.',
        docs: [{ titre: 'Règlement intérieur du CSE', date: d(1, 15), url: '#demo' }, { titre: 'Accord d\'entreprise (exemple)', date: d(2, 1), url: '#demo' }] },
      demandes: [{ id: 'x1', at: plus(-3) + 'T10:00:00', type: 'materiel', resume: '1 x Chapiteau 3x6 du ' + fd(d(8, 20)) + ' au ' + fd(d(8, 22)), statut: 'acceptée', reponse: 'C\'est noté, à récupérer vendredi.' }, { id: 'x2', at: plus(-1) + 'T18:00:00', type: 'fiche', resume: 'Modifier : téléphone', statut: 'en attente', reponse: '' }] };
  }


  function E(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function eur(n) { return (Number(n) || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' }); }
  function fd(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function $(id) { return document.getElementById(id); }

  async function api(method, body) {
    if (DEMO) {
      if (!D) D = demoData();
      if (method === 'POST' && body.action === 'idee') { await new Promise(function (r) { setTimeout(r, 500); }); if (!body.anonyme) D.fiche.idees.unshift({ date: today(), type: body.type, texte: body.texte, statut: 'Reçue', reponse: '' }); return { ok: true }; }
      if (method === 'POST') { await new Promise(function (r) { setTimeout(r, 500); }); D.demandes.push({ id: 'n' + Date.now(), at: new Date().toISOString(), type: body.type, resume: body.resume, statut: 'en attente', reponse: '' }); return { ok: true }; }
      return D;
    }
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(URLS) || (!T && !(PUBLIC && method === 'POST'))) throw new Error('Lien incomplet. Ouvrez le lien reçu par e-mail du CSE.');
    var r = method === 'GET'
      ? await fetch(URLS + '?action=moi&t=' + encodeURIComponent(T), { redirect: 'follow', cache: 'no-store' })
      : await fetch(URLS, { method: 'POST', redirect: 'follow', body: JSON.stringify(Object.assign({ action: 'demande', t: T || '' }, body)) });
    var j; try { j = await r.json(); } catch (e) { throw new Error('Le service du CSE ne répond pas. Réessayez dans un moment.'); }
    if (j.error) throw new Error(j.error);
    return j;
  }

  async function load() {
    try {
      D = await api('GET');
      var f = D.fiche, P = D.pub || {};
      $('h-cse').textContent = (P.cse && P.cse.nom) || 'CSE';
      $('h-nom').textContent = 'Bonjour ' + (f.prenom || f.nom || '');
      document.title = 'Mon espace CSE · ' + (f.prenom || '');
      if (DEMO) $('nav').insertAdjacentHTML('beforebegin', '<div class="msg warn" style="margin:0 0 10px">👀 Exemple avec un salarié fictif : rien n\'est envoyé au CSE.</div>');
      $('foot').innerHTML = 'Informations mises à jour le ' + E(fd(String(D.le || '').slice(0, 10))) + '. Cette page est personnelle : ne partagez pas son lien.';
      nav(); render();
    } catch (e) {
      $('app').innerHTML = '<div class="card"><h2>⚠️ Impossible d\'ouvrir votre espace</h2><p>' + E(e.message) + '</p><p class="mute">Si le problème continue, contactez le CSE.</p><button class="btn" onclick="location.reload()">Réessayer</button></div>';
    }
  }

 var TABS = [['accueil', '🏠 Accueil'], ['billets', '🎟️ Billetterie'], ['idees', '💡 Idées & questions'], ['achats', '🎟️ Mes achats'], ['offert', '🎁 Offert par le CSE'], ['cv', '🏖️ Chèques vacances'], ['sorties', '🎭 Sorties'], ['materiel', '⛺ Matériel'], ['docs', '📄 Documents'], ['fiche', '👤 Ma fiche'], ['demandes', '📨 Mes demandes']];
  function nav() {
    var n = (D.demandes || []).filter(function (d) { return d.statut === 'en attente'; }).length;
    var el = $('nav'); el.hidden = false;
    el.innerHTML = TABS.map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === TAB ? 'on' : '') + '">' + t[1] + (t[0] === 'demandes' && n ? '<span class="n">' + n + '</span>' : '') + '</button>'; }).join('');
    el.querySelectorAll('button').forEach(function (b) { b.onclick = function () { go(b.dataset.t); }; });
    var on = el.querySelector('.on'); if (on && on.scrollIntoView && el.scrollWidth > el.clientWidth) { try { el.scrollLeft = Math.max(0, on.offsetLeft - 40); } catch (e) { } }
    var fade = function () { el.classList.toggle('end', el.scrollLeft + el.clientWidth >= el.scrollWidth - 4); }; el.onscroll = fade; fade();
  }
  function go(t) { TAB = t; nav(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  window.cseGo = go;

  function yearsOf(list, key) {
    var y = {}; y[String(new Date().getFullYear())] = 1;
    list.forEach(function (x) { var v = String(x[key] || '').slice(0, 4); if (/^\d{4}$/.test(v)) y[v] = 1; });
    return Object.keys(y).sort().reverse();
  }
  function yearBar(years) {
    return '<div class="year">' + years.map(function (y) { return '<button class="btn s' + (y === YEAR ? ' p' : '') + '" onclick="cseYear(\'' + y + '\')">' + y + '</button>'; }).join('') + '</div>';
  }
  window.cseYear = function (y) { YEAR = y; render(); };

  function render() {
    var f = D.fiche, P = D.pub || {}, h = '';
    var R = {
      accueil: function () {
        var offY = (f.offert || []).filter(function (o) { return String(o.date).slice(0, 4) === String(new Date().getFullYear()); }).reduce(function (s, o) { return s + (o.montant || 0); }, 0);
        var due = (f.achats || []).filter(function (a) { return !a.regle; }).reduce(function (s, a) { return s + a.total; }, 0) + (f.sorties || []).reduce(function (s, x) { return s + (x.aRegler || 0); }, 0);
        var cvDue = 0; (f.cv || []).forEach(function (c) { (c.echeances || []).forEach(function (e) { if (e.statut !== 'payé') cvDue += e.montant || 0; }); });
        var open = (P.sorties || []).filter(function (o) { return !(f.sorties || []).some(function (x) { return x.outingId === o.id; }); });
        h += '<div class="kpis">'
          + '<div class="kpi" onclick="cseGo(\'offert\')"><span>Offert par le CSE en ' + new Date().getFullYear() + '</span><b>' + eur(offY) + '</b></div>'
          + '<div class="kpi" onclick="cseGo(\'achats\')"><span>Reste à régler</span><b style="color:' + (due ? 'var(--bad)' : 'var(--ok)') + '">' + eur(due) + '</b></div>'
          + '<div class="kpi" onclick="cseGo(\'cv\')"><span>Chèques vacances : à payer</span><b>' + eur(cvDue) + '</b></div>'
          + '<div class="kpi" onclick="cseGo(\'sorties\')"><span>Sorties ouvertes</span><b>' + open.length + '</b></div></div>';
        if (open.length) h += '<div class="card" style="margin-top:12px"><h2>🎭 Sorties où vous pouvez vous inscrire</h2>' + open.slice(0, 4).map(outingRow).join('') + '</div>';
        h += cvCard('🏖️ Chèques vacances');
        h += '<div class="card"><h2>💡 Une idée, une question pour la réunion ?</h2><p class="mute">Boîte à idées, idée de sortie, question à poser à la prochaine réunion du CSE : avec votre nom ou en anonyme.</p><button class="btn p" onclick="cseGo(\'idees\')">Donner mon idée</button></div>';
        h += swileCard();
        h += installCard();
        h += '<div class="card"><h2>💬 Une question ?</h2><p class="mute">Écrivez au CSE directement d\'ici, ou par e-mail.</p><button class="btn" onclick="cseMsg()">Écrire au CSE</button> '
          + (P.cse && P.cse.email ? '<a class="btn" href="mailto:' + E(P.cse.email) + '">✉️ ' + E(P.cse.email) + '</a>' : '') + '</div>';
      },
      achats: function () {
        var L = f.achats || [], ys = yearsOf(L, 'date'), Y = L.filter(function (a) { return String(a.date).slice(0, 4) === YEAR; });
        h += '<div class="card"><h2>🎟️ Mes achats</h2>' + yearBar(ys);
        h += Y.length ? Y.map(function (a) { return '<div class="row"><div class="l"><b>' + E(a.desc) + '</b><div class="mute">' + fd(a.date) + (a.mode ? ' · ' + E(a.mode) : '') + '</div></div><div class="r">' + eur(a.total) + '<br>' + (a.regle ? '<span class="tag ok">Réglé</span>' : '<span class="tag bad">À régler</span>') + '</div></div>'; }).join('')
          + '<div class="row"><div class="l"><b>Total ' + YEAR + '</b></div><div class="r">' + eur(Y.reduce(function (s, a) { return s + a.total; }, 0)) + '</div></div>' : '<p class="empty">Aucun achat en ' + YEAR + '.</p>';

    var full = o.places != null && o.restantes <= 0, late = o.limite && o.limite < today();
    return '<div class="row"><div class="l"><b>' + E(o.nom) + '</b><div class="mute">' + fd(o.date) + (o.lieu ? ' · ' + E(o.lieu) : '') + '</div>'
      + '<div class="mute">Vous : ' + eur(o.prix.salarie) + ' · invité adulte : ' + eur(o.prix.adulte) + ' · enfant : ' + eur(o.prix.enfant) + '</div>'
      + (o.limite ? '<div class="mute">Inscriptions jusqu\'au ' + fd(o.limite) + '</div>' : '') + (o.notes ? '<div class="mute">' + E(o.notes) + '</div>' : '') + '</div>'
      + '<div class="r">' + (o.places != null ? '<span class="tag ' + (full ? 'bad' : 'info') + '">' + (full ? 'Complet' : o.restantes + ' place(s)') + '</span><br>' : '')
      + (late ? '<span class="tag warn">Clôturé</span>' : '<button class="btn s p" style="margin-top:6px" onclick="cseSortie(' + o.id + ')">' + (full ? 'Liste d\'attente' : 'S\'inscrire') + '</button>') + '</div></div>';
  }

  // --- Fenêtre de saisie ---
  function sheet(html) { $('sheet').innerHTML = html; $('overlay').classList.add('on'); }
  function closeSheet() { $('overlay').classList.remove('on'); }
  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeSheet(); });
  window.cseClose = closeSheet;
  function head(t, sub) { return '<div class="top"><div><h2>' + E(t) + '</h2>' + (sub ? '<div class="mute">' + sub + '</div>' : '') + '</div><button class="x" onclick="cseClose()" aria-label="Fermer">×</button></div>'; }
  function alertBox(m) { sheet(head('Chèques vacances') + '<p>' + E(m) + '</p><button class="btn" onclick="cseClose()">OK</button>'); }

  // --- Installer l'appli sur le téléphone ---
  var PROMPT = null, STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); PROMPT = e; var b = $('inst-btn'); if (b) b.hidden = false; });
  window.addEventListener('appinstalled', function () { var b = $('inst-card'); if (b) b.hidden = true; });
  function installCard() {
    if (STANDALONE) return '';
    return '<div class="card" id="inst-card"><h2>📲 Installer l\'appli sur mon téléphone</h2><p class="mute">Gardez votre espace CSE comme une appli, sur l\'écran d\'accueil, sans rien télécharger dans un magasin d\'applications.</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="cseInstall(\'android\')">🤖 Android</button><button class="btn p" onclick="cseInstall(\'ios\')">🍏 iPhone</button></div></div>';
  }
  window.cseInstall = async function (os) {
    if (os === 'android' && PROMPT) { PROMPT.prompt(); try { await PROMPT.userChoice; } catch (e) { } PROMPT = null; return; }
    if (os === 'ios') sheet(head('Installer sur iPhone') + '<ol style="padding-left:20px;line-height:1.8"><li>Ouvrez ce lien avec <b>Safari</b> (pas dans l\'appli Gmail : appuyez sur ⋯ puis « Ouvrir dans Safari »).</li><li>Appuyez sur le bouton <b>Partager</b> <span style="font-size:18px">⬆︎</span> en bas de l\'écran.</li><li>Choisissez <b>« Sur l\'écran d\'accueil »</b>, puis <b>Ajouter</b>.</li></ol><p class="mute">L\'icône « Mon CSE » apparaît sur votre écran d\'accueil.</p><button class="btn" onclick="cseClose()">OK</button>');
    else if (os === 'choix') sheet(head('Installer l\'appli') + '<p>Ouvrez ce lien sur votre téléphone, puis choisissez :</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn p" onclick="cseInstall(\'android\')">🤖 Android</button><button class="btn p" onclick="cseInstall(\'ios\')">🍏 iPhone</button></div><p class="mute" style="margin-top:10px">Astuce : sur PC (Chrome ou Edge), l\'icône ⊕ dans la barre d\'adresse installe aussi l\'appli.</p>');
    else sheet(head('Installer sur Android') + '<ol style="padding-left:20px;line-height:1.8"><li>Ouvrez ce lien avec <b>Chrome</b> (dans Gmail : ⋮ puis « Ouvrir dans Chrome »).</li><li>Appuyez sur <b>⋮</b> en haut à droite.</li><li>Choisissez <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>.</li></ol><p class="mute">L\'icône « Mon CSE » apparaît avec vos applications.</p><button class="btn" onclick="cseClose()">OK</button>');
  };
  (function () { var b = $('h-inst'); if (!b || STANDALONE || PUBLIC) return; b.hidden = false; b.onclick = function () { if (PROMPT) cseInstall('android'); else cseInstall(IOS ? 'ios' : (/android/i.test(navigator.userAgent) ? 'android' : 'choix')); }; })();
  try { if ('serviceWorker' in navigator && /^https:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () { }); } catch (e) { }

  function say(id, m, cl) { var el = $(id); if (el) el.innerHTML = '<div class="msg ' + (cl || 'info') + '">' + E(m) + '</div>'; }

  async function send(type, data, resume, msgId, btnId) {
    var b = $(btnId); if (b) b.disabled = true; say(msgId, 'Envoi…', 'info');
    try {
      await api('POST', { type: type, data: data, resume: resume });
      say(msgId, (DEMO ? '(Exemple) ' : '') + '✔ Demande envoyée au CSE. Vous recevrez la réponse par e-mail et dans « Mes demandes ».', 'ok');
      var j = await api('GET'); D = j; nav();
      setTimeout(function () { closeSheet(); }, 2200);
    } catch (e) { say(msgId, e.message, 'bad'); if (b) b.disabled = false; }
  }

  window.cseSortie = function (outingId, regId) {
    var o = (D.pub.sorties || []).filter(function (s) { return s.id === outingId; })[0]; if (!o) return;
    var mine = regId ? (D.fiche.sorties || []).filter(function (x) { return x.regId === regId; })[0] : null;
    var guests = mine ? JSON.parse(JSON.stringify(mine.invites || [])) : [];
    sheet(head(regId ? 'Modifier mon inscription' : 'M\'inscrire : ' + o.nom, fd(o.date) + (o.lieu ? ' · ' + E(o.lieu) : ''))
      + '<p>Inscription au nom de <b>' + E(D.fiche.nom) + '</b>.</p><label>Personnes qui viennent avec vous</label><div id="g-list"></div>'
      + '<button class="btn s" id="g-add" style="margin-top:6px">+ Ajouter une personne</button>'
      + '<div id="g-tot" class="row" style="margin-top:10px"></div><label>Remarque (facultatif)</label><textarea id="g-note"></textarea>'
      + '<div style="margin-top:12px"><button class="btn p" id="g-go">' + (regId ? 'Envoyer la modification' : 'Envoyer mon inscription') + '</button></div><div id="g-msg"></div>');
    function tot() { return o.prix.salarie + guests.reduce(function (s, g) { return s + (g.isChild ? o.prix.enfant : o.prix.adulte); }, 0); }
    function draw() {
      $('g-list').innerHTML = guests.map(function (g, i) { return '<div class="guest"><input placeholder="Prénom Nom" value="' + E(g.name) + '" data-i="' + i + '"><label><input type="checkbox" data-c="' + i + '"' + (g.isChild ? ' checked' : '') + '> enfant</label><button class="btn s" data-d="' + i + '">✕</button></div>'; }).join('') || '<p class="empty">Personne d\'autre.</p>';
      $('g-list').querySelectorAll('[data-i]').forEach(function (inp) { inp.oninput = function () { guests[inp.dataset.i].name = inp.value; }; });
      $('g-list').querySelectorAll('[data-c]').forEach(function (inp) { inp.onchange = function () { guests[inp.dataset.c].isChild = inp.checked; $('g-tot').innerHTML = '<div class="l">Total à régler au CSE</div><div class="r">' + eur(tot()) + '</div>'; }; });
      $('g-list').querySelectorAll('[data-d]').forEach(function (b) { b.onclick = function () { guests.splice(Number(b.dataset.d), 1); draw(); }; });
      $('g-tot').innerHTML = '<div class="l">Total à régler au CSE</div><div class="r">' + eur(tot()) + '</div>';
    }
    draw();
    $('g-add').onclick = function () { guests.push({ name: '', isChild: false }); draw(); };
    $('g-go').onclick = function () {
      if (guests.some(function (g) { return !String(g.name || '').trim(); })) return say('g-msg', 'Indiquez le nom de chaque personne (ou retirez-la).', 'bad');
      var G = guests.map(function (g) { return { name: g.name.trim(), isChild: !!g.isChild }; });
      send(regId ? 'sortie-modif' : 'sortie', { outingId: outingId, regId: regId || null, sortie: o.nom, invites: G, note: $('g-note').value.trim(), total: tot() },
        (regId ? 'Modifier mon inscription : ' : 'Inscription : ') + o.nom + ' (' + fd(o.date) + ') : moi' + (G.length ? ' + ' + G.length + ' personne(s)' : ''), 'g-msg', 'g-go');
    };
  };
  window.cseAnnul = function (outingId, regId) {
    var x = (D.fiche.sorties || []).filter(function (s) { return s.regId === regId; })[0]; if (!x) return;
    sheet(head('Annuler mon inscription', E(x.nom) + ' · ' + fd(x.date)) + '<p>Vous demandez l\'annulation de votre inscription. Le CSE vous confirmera, notamment pour un éventuel remboursement.</p><label>Raison (facultatif)</label><textarea id="a-note"></textarea><div style="margin-top:12px"><button class="btn p" id="a-go">Demander l\'annulation</button></div><div id="a-msg"></div>');
    $('a-go').onclick = function () { send('sortie-annul', { outingId: outingId, regId: regId, sortie: x.nom, note: $('a-note').value.trim() }, 'Annuler mon inscription : ' + x.nom + ' (' + fd(x.date) + ')', 'a-msg', 'a-go'); };
  };
  function chqResume(L) {
    var C = L.filter(function (e) { return /ch[eè]que/i.test(e.mode || ''); }); if (!C.length) return '';
    var ok = C.filter(function (e) { return e.statut === 'reçu' || e.statut === 'payé'; }), manque = C.length - ok.length;
    return '<div class="row"><div class="l"><b>Vos chèques</b><div class="mute">' + ok.length + ' sur ' + C.length + ' remis au CSE' + (manque ? ' · ' + manque + ' à remettre à la permanence (' + eur(C.filter(function (e) { return e.statut !== 'reçu' && e.statut !== 'payé'; }).reduce(function (a, e) { return a + (e.montant || 0); }, 0)) + ')' : '') + '</div></div><div class="r"><span class="tag ' + (manque ? 'warn' : 'ok') + '">' + (manque ? 'Chèques manquants' : 'Tous remis') + '</span></div></div>';
  }
  function cvAnnee() { return String((D.pub.cv && D.pub.cv.annee) || new Date().getFullYear()); }
  function cvBloque() {
    var a = cvAnnee();
    if ((D.fiche.cv || []).some(function (c) { return String(c.annee) === a; })) return 'Vous avez déjà un dossier de chèques vacances pour ' + a + '.';
    if ((D.demandes || []).some(function (d) { return d.type === 'cv' && d.statut !== 'refusée' && (d.data && d.data.annee ? String(d.data.annee) === a : d.statut === 'en attente'); })) return 'Votre demande de chèques vacances est déjà envoyée au CSE : vous la suivez dans « Mes demandes ».';
    return '';
  }
  function cvCard(titre) {
    var C = D.pub.cv || {}; if (!C.ouvert) return '';
    var b = cvBloque();
    return '<div class="card"><h2>' + titre + '</h2><p>' + E(C.texte || 'Les inscriptions aux chèques vacances ' + cvAnnee() + ' sont ouvertes.') + '</p>'
      + (b ? '<div class="msg info">' + E(b) + '</div>' : '<button class="btn p" onclick="cseCv()">S\'inscrire aux chèques vacances ' + cvAnnee() + '</button>') + '</div>';
  }
  window.cseCv = function () {
    var C = D.pub.cv || {};
    if (cvBloque()) { alertBox(cvBloque()); return; }
    sheet(head('S\'inscrire aux chèques vacances') + (C.texte ? '<p>' + E(C.texte) + '</p>' : '')
      + '<label>Montant de chèques souhaité (€)</label><input id="c-m" type="number" min="0" step="10" placeholder="ex. 400">'
      + '<label>Format</label><select id="c-f"><option>Papier</option><option>Connect (sur le téléphone)</option><option>Swile</option></select>'
      + '<label>Comment souhaitez-vous payer votre part ?</label><select id="c-p"><option>En une fois</option><option>En plusieurs fois</option><option>À voir avec le CSE</option></select>'
      + '<label>Remarque (facultatif)</label><textarea id="c-n"></textarea><p class="mute">Le CSE valide votre inscription et vous indique votre part et les échéances. Les paiements sont enregistrés uniquement par le CSE.</p>'
      + '<div style="margin-top:12px"><button class="btn p" id="c-go">Envoyer mon inscription</button></div><div id="c-msg"></div>');
    $('c-go').onclick = function () {
      var m = parseFloat($('c-m').value) || 0; if (m <= 0) return say('c-msg', 'Indiquez un montant.', 'bad');
      send('cv', { annee: cvAnnee(), montant: m, format: $('c-f').value, paiement: $('c-p').value, note: $('c-n').value.trim() }, 'Chèques vacances : ' + eur(m) + ' (' + $('c-f').value + ')', 'c-msg', 'c-go');
    };
  };
  window.cseMsg = function () {
    sheet(head('Écrire au CSE') + '<label>Votre message</label><textarea id="w-t" style="min-height:120px"></textarea><div style="margin-top:12px"><button class="btn p" id="w-go">Envoyer</button></div><div id="w-msg"></div>');
    $('w-go').onclick = function () { var t = $('w-t').value.trim(); if (!t) return say('w-msg', 'Écrivez votre message.', 'bad'); send('message', { texte: t }, 'Message : ' + t.slice(0, 80), 'w-msg', 'w-go'); };
  };

  if (PUBLIC) cseIdeaPublic(); else load();
})();
</script>
</body>
</html>
